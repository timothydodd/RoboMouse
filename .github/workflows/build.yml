name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      # Native AOT: one self-contained native executable, no .NET runtime needed on the target.
      # Needs the C++ build tools that ship with Visual Studio on the hosted Windows image.
      - name: Publish (Native AOT)
        run: >
          dotnet publish src/RoboMouse.App
          --configuration Release
          --runtime win-x64
          --output publish

      - name: Drop debug symbols from the publish folder
        shell: pwsh
        run: Get-ChildItem publish -Filter *.pdb | Remove-Item

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: RoboMouse-win-x64
          path: publish/

      - name: Build Store package (MSIX)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          STORE_PACKAGE_NAME: ${{ secrets.STORE_PACKAGE_NAME }}
          STORE_PUBLISHER: ${{ secrets.STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY: ${{ secrets.STORE_PUBLISHER_DISPLAY }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if ($version.Split(".").Count -eq 3) { $version = "$version.0" }
          ./packaging/Build-Msix.ps1 -Version $version -Output artifacts

      - name: Upload Store package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: RoboMouse-msix
          path: artifacts/*.msix

      - name: Package release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath "RoboMouse-${{ github.ref_name }}-win-x64.zip"

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: RoboMouse-${{ github.ref_name }}-win-x64.zip
          generate_release_notes: true
